<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>doxy tracker</title>
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="doxy">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #262c36;
    --accent: #4ade80;
    --accent-dim: #1a3a28;
    --warn: #fbbf24;
    --text: #e6edf3;
    --muted: #7d8590;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px; margin: 0 auto; padding: 16px 16px 48px;
    min-height: 100vh;
  }
  h1 { font-size: 22px; margin: 8px 0 2px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  /* progress */
  .bar-wrap { background: var(--accent-dim); border-radius: 99px; height: 14px; overflow: hidden; margin: 10px 0 6px; }
  .bar { background: var(--accent); height: 100%; border-radius: 99px; transition: width .4s ease; }
  .progress-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .progress-line b { color: var(--text); }
  /* next dose */
  .next-dose { text-align: center; }
  .next-dose .when { font-size: 26px; font-weight: 700; margin: 2px 0; }
  .next-dose .label { color: var(--muted); font-size: 13px; }
  .overdue { color: var(--warn); }
  /* dose grid */
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
  .cell {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border);
    background: #0d1117; display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer; user-select: none; transition: transform .08s;
  }
  .cell:active { transform: scale(0.88); }
  .cell.taken { background: var(--accent); border-color: var(--accent); }
  .cell.next { border-color: var(--warn); border-width: 2px; }
  .cell.future { opacity: 0.55; }
  .day-label { grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin-top: 6px; }
  /* buttons */
  .big-btn {
    width: 100%; padding: 16px; border-radius: 14px; border: none;
    font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 10px;
  }
  .big-btn.primary { background: var(--accent); color: #052e12; }
  .big-btn.secondary { background: #21262d; color: var(--text); border: 1px solid var(--border); }
  .big-btn.primary:disabled { background: #21262d; color: var(--muted); border: 1px solid var(--border); cursor: default; }
  /* naproxen */
  .nap-last { font-size: 14px; margin-top: 8px; color: var(--muted); }
  .nap-last b { color: var(--text); }
  .nap-ok { color: var(--accent); }
  .nap-warn { color: var(--warn); }
  .done-banner { text-align: center; font-size: 20px; font-weight: 700; color: var(--accent); padding: 8px 0; display: none; }
  .footnote { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
  <h1>💊 doxy tracker</h1>
  <div class="sub">doxycycline 100mg - twice a day with food - 21 days</div>

  <div class="card">
    <div class="progress-line"><span><b id="doseCount">0</b> / 42 doses</span><span>day <b id="dayCount">1</b> / 21</span></div>
    <div class="bar-wrap"><div class="bar" id="bar" style="width:0%"></div></div>
    <div class="progress-line"><span id="pct">0%</span><span id="endDate">ends Sep 25</span></div>
  </div>

  <div class="card next-dose">
    <div class="label" id="nextLabel">next dose</div>
    <div class="when" id="nextWhen">-</div>
    <div class="label" id="nextIn">-</div>
    <button class="big-btn primary" id="takeBtn">Take it now ✓</button>
  </div>

  <div class="done-banner" id="doneBanner">🏆 course complete. go outside.</div>

  <div class="card">
    <div class="progress-line"><span><b>naproxen</b> 500mg</span><span>as needed, max every 12h</span></div>
    <button class="big-btn secondary" id="napBtn">Took naproxen</button>
    <div class="nap-last" id="napLast">no doses logged yet</div>
  </div>

  <div class="card">
    <div class="progress-line"><span><b>the board</b></span><span>tap a pill to toggle</span></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="footnote">state lives on this device only - same browser, same truth</div>

<script>
// Course: Sept 5 - Sept 25, 2026. All of it is EDT (UTC-4).
var ET_OFFSET = "-04:00";
var START = "2026-09-05";
var DAYS = 21;

function slotISO(dayIdx, half) { // half 0 = 9am, 1 = 9pm
  var d = new Date(Date.UTC(2026, 8, 5 + dayIdx));
  var y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,"0"), dd = String(d.getUTCDate()).padStart(2,"0");
  return y + "-" + m + "-" + dd + "T" + (half === 0 ? "09:00:00" : "21:00:00") + ET_OFFSET;
}
function slotDate(dayIdx, half) { return new Date(slotISO(dayIdx, half)); }

var SLOTS = [];
for (var i = 0; i < DAYS; i++) { SLOTS.push({day:i, half:0, t: slotDate(i,0)}); SLOTS.push({day:i, half:1, t: slotDate(i,1)}); }

var KEY = "doxy-tracker-v2";
var OLD_KEY = "doxy-tracker-v1";
// v1's pre-seeded doses, so migration can tell seed entries from ones he logged himself
var V1_SEED = {
  "0": "2026-09-05T09:00:00-04:00",
  "1": "2026-09-05T21:00:00-04:00",
  "2": "2026-09-06T08:45:00-04:00"
};
// Actual history: doxy Sept 5 ~12:00am (hospital, outside the 9/9 slots), Sept 5 ~9am,
// Sept 5 ~9pm, Sept 6 ~8:45am. Naproxen: Sept 5 morning, Sept 5 night, Sept 6 morning.
function freshSeed() {
  return {
    doses: {
      "0": "2026-09-05T09:00:00-04:00",
      "1": "2026-09-05T21:00:00-04:00",
      "2": "2026-09-06T08:45:00-04:00"
    },
    extras: ["2026-09-05T00:00:00-04:00"], // hospital dose, off-schedule
    naproxen: [
      "2026-09-05T08:00:00-04:00",
      "2026-09-05T21:30:00-04:00",
      "2026-09-06T08:45:00-04:00"
    ]
  };
}
function load() {
  try {
    var s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.doses) { if (!s.extras) s.extras = []; return s; }
  } catch(e) {}
  var seed = freshSeed();
  try {
    var old = JSON.parse(localStorage.getItem(OLD_KEY));
    if (old && old.doses) {
      // keep anything that isn't a byte-identical v1 seed entry (i.e. he logged/toggled it)
      Object.keys(old.doses).forEach(function(k) {
        if (!(k in V1_SEED && old.doses[k] === V1_SEED[k])) seed.doses[k] = old.doses[k];
      });
      // merge his naproxen logs, dedupe against seed entries within 1h
      (old.naproxen || []).forEach(function(t) {
        var tm = new Date(t).getTime();
        var dupe = seed.naproxen.some(function(x) { return Math.abs(new Date(x).getTime() - tm) < 3600000; });
        if (!dupe) seed.naproxen.push(t);
      });
      seed.naproxen.sort();
    }
  } catch(e) {}
  try { localStorage.setItem(KEY, JSON.stringify(seed)); localStorage.removeItem(OLD_KEY); } catch(e) {}
  return seed;
}
var state = load();
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function fmtWhen(d) {
  return d.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric", timeZone:"America/New_York"})
    + " " + d.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit", timeZone:"America/New_York"});
}
function relTime(d) {
  var s = Math.round((d - Date.now())/1000);
  var past = s < 0; s = Math.abs(s);
  if (s < 60) return past ? "just now" : "now";
  var h = Math.floor(s/3600), m = Math.round((s%3600)/60);
  var str = h > 0 ? h + "h " + m + "m" : m + "m";
  return past ? str + " ago" : "in " + str;
}
function takenCount() { return Object.keys(state.doses).length + (state.extras ? state.extras.length : 0); }

function nextSlot() {
  var now = Date.now();
  for (var i = 0; i < SLOTS.length; i++) {
    if (!state.doses[i]) {
      return {idx: i, slot: SLOTS[i], overdue: SLOTS[i].t.getTime() < now};
    }
  }
  return null;
}

function render() {
  var n = takenCount();
  document.getElementById("doseCount").textContent = n;
  document.getElementById("dayCount").textContent = Math.min(DAYS, Math.floor(n/2) + (n % 2 ? 1 : 0) || 1);
  var pct = Math.round(n/42*100);
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("pct").textContent = pct + "%";

  var ns = nextSlot();
  var banner = document.getElementById("doneBanner");
  var takeBtn = document.getElementById("takeBtn");
  if (!ns) {
    banner.style.display = "block";
    document.getElementById("nextLabel").textContent = "all done";
    document.getElementById("nextWhen").textContent = "🎉";
    document.getElementById("nextIn").textContent = "";
    takeBtn.style.display = "none";
    takeBtn.disabled = true;
  } else {
    banner.style.display = "none";
    takeBtn.style.display = "block";
    var overdue = ns.overdue;
    var slotName = (ns.slot.half === 0 ? "☀️ 9:00 AM" : "🌙 9:00 PM") + " - " + ns.slot.t.toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric", timeZone:"America/New_York"});
    document.getElementById("nextLabel").textContent = overdue ? "dose due" : "next dose";
    var w = document.getElementById("nextWhen");
    w.textContent = slotName;
    w.className = "when" + (overdue ? " overdue" : "");
    document.getElementById("nextIn").textContent = overdue ? "was due " + relTime(ns.slot.t) : relTime(ns.slot.t);
    // gate the button: only enabled while a slot has arrived and is untaken
    takeBtn.disabled = !overdue;
    takeBtn.textContent = overdue ? "Take it now ✓" : "Next dose: " + slotName;
  }

  // naproxen
  var naps = state.naproxen;
  var napEl = document.getElementById("napLast");
  if (naps.length) {
    var last = new Date(naps[naps.length-1]);
    var hrs = (Date.now() - last.getTime())/3600000;
    napEl.innerHTML = "last dose: <b>" + fmtWhen(last) + "</b> (" + relTime(last) + ") - " +
      (hrs >= 12 ? "<span class='nap-ok'>clear to take if needed</span>" : "<span class='nap-warn'>wait " + Math.ceil(12-hrs) + "h before another</span>");
  } else {
    napEl.textContent = "no doses logged yet";
  }

  // grid
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  var now = Date.now();
  for (var d = 0; d < DAYS; d++) {
    var lbl = document.createElement("div");
    lbl.className = "day-label";
    lbl.textContent = "day " + (d+1) + " - " + slotDate(d,0).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"America/New_York"});
    grid.appendChild(lbl);
    for (var h = 0; h < 2; h++) {
      (function(dayIdx, half){
        var idx = dayIdx*2 + half;
        var c = document.createElement("div");
        c.className = "cell";
        var taken = state.doses[idx] !== undefined;
        if (taken) { c.classList.add("taken"); c.textContent = "✓"; }
        else {
          c.textContent = half === 0 ? "☀️" : "🌙";
          if (SLOTS[idx].t.getTime() > now) c.classList.add("future");
          if (ns && ns.idx === idx) c.classList.add("next");
        }
        c.title = fmtWhen(SLOTS[idx].t) + (taken ? " - taken " + fmtWhen(new Date(state.doses[idx])) : "");
        c.onclick = function() {
          if (state.doses[idx] !== undefined) {
            if (confirm("Undo this dose?")) { delete state.doses[idx]; save(); render(); }
          } else {
            state.doses[idx] = new Date().toISOString();
            save(); render();
          }
        };
        grid.appendChild(c);
      })(d, h);
    }
  }
}

document.getElementById("takeBtn").onclick = function() {
  var ns = nextSlot();
  if (!ns || !ns.overdue) return; // locked until a slot actually arrives
  state.doses[ns.idx] = new Date().toISOString();
  save(); render();
};
document.getElementById("napBtn").onclick = function() {
  var naps = state.naproxen;
  if (naps.length) {
    var last = new Date(naps[naps.length-1]);
    var hrs = (Date.now() - last.getTime())/3600000;
    if (hrs < 12 && !confirm("It's been less than 12h since the last naproxen. Log anyway?")) return;
  }
  naps.push(new Date().toISOString());
  save(); render();
};

render();
setInterval(render, 60000);
</script>
</body>
</html>
